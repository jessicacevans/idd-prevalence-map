        // The text-only Scattergeo is always the very last trace in the geo group
        if (traces.length > 0) {
          traces[traces.length - 1].style.pointerEvents = 'none';
        }
      });
    });
  }
  // Fire after Plotly has fully rendered
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(applyFix, 500);
    setTimeout(applyFix, 1500);
  });
  setTimeout(applyFix, 800);
  setTimeout(applyFix, 2000);
})();
</script>

</body>
